[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "triage-guard-agent"
version = "1.0.0"
description = "A resilient LangGraph support triage agent with durable human approval gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "triage-guard-agent contributors" }]
dependencies = [
  "langgraph==1.2.12",
  "langchain-core==1.6.4",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.6.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
triage-guard = "triage_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_guard"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

